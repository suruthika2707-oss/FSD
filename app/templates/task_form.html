
{% extends 'base.html' %}

{% block title %}Add Task{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="custom-card">

            <h2>Add Task</h2>
            <p class="text-muted">
                Milestone: {{ milestone.title }}
            </p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Save Task
                </button>

                <a href="{% url 'project_detail' milestone.project.id %}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>

        </div>

    </div>
</div>

{% endblock %}
