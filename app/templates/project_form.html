
{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="custom-card">

            <h2>{{ title }}</h2>
            <p class="text-muted">Enter your project information.</p>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Save Project
                </button>

                <a href="{% url 'project_list' %}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </form>

        </div>

    </div>
</div>

{% endblock %}
